version: '3.8'

services:
  mysqldbauri:
    image: mysql:8.0.30
    container_name: mysqldbauri
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: aurigraph
      MYSQL_DATABASE: AurigraphFarmers
    volumes:
      - mysqldata:/var/lib/mysql
