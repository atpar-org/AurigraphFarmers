version: '3.8'

services:
  mysqldbauri:
    image: mysql:8.0.30
    container_name: acm-db
    restart: always
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysqldata:/var/lib/mysql


  backend:
    image: shivain22/aurigraph-farmers-app:v29
    container_name: acm-backend
    restart: always
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT}:${SERVER_PORT}"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldbauri:3306/${MYSQL_DATABASE}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    depends_on:
      - mysqldbauri


    volumes:
      - ./data/acm-content:/mnt/content
  # ACM Frontend
  frontend:
    image: shivain22/auri-farmer:v6.2
    container_name: acm-frontend
    restart: always
    ports:
      - "3005:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_OFBIZ_API_URL: ${NEXT_PUBLIC_OFBIZ_API_URL}


  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

volumes:
  mysqldata:
  redisdata:
