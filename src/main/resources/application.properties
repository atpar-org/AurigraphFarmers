spring.application.name=aurigraph.farmers

spring.profiles.active=dev

server.port=8005


spring.datasource.url=jdbc:mysql://localhost:3307/AurigraphFarmers?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
## Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/Aurigraph-Farmers-api-docs
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
aurigraph.farmers.openapi.dev-url=${AURIGRAPH_FARMERS_OPENAPI_DEV_URL:http://localhost:8005}
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:5GB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:5GB}
spring.servlet.multipart.enabled=${SPRING_SERVLET_MULTIPART_ENABLED:true}


app.file.target.dir=${APP_FILE_TARGET_DIR:target/classes/static}
resource.location=${RESOURCE_LOCATION:classpath:/static/content/}

spring.mvc.view.prefix=/templates/
spring.mvc.view.suffix=.html
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY}
# 1h in millisecond
security.jwt.expiration-time=3600000

twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
twilio.phone.number=${TWILIO_PHONE_NUMBER}

digiLocker.client.id=${DIGILOCKER_CLIENT_ID}
digiLocker.client.secret=${DIGILOCKER_CLIENT_SECRET}
digiLocker.redirect.uri=${DIGILOCKER_REDIRECT_URI:https://acm.atparui.com/create}
digiLocker.token.url=${DIGILOCKER_TOKEN_URL:https://digilocker.meripehchaan.gov.in/public/oauth2/2/token}
digiLocker.docs.url.issued=${DIGILOCKER_DOCS_URL_ISSUED:https://digilocker.meripehchaan.gov.in/public/oauth2/2/files/issued}
digiLocker.docs.url.e-aadhaar=${DIGILOCKER_DOCS_URL_E-AADHAAR:https://digilocker.meripehchaan.gov.in/public/oauth2/3/xml/eaadhaar}

server.url=${SERVER_URL:http://localhost:8005/}
digiLocker.docs.by.uri=${DIGILOCKER_DOCS_BY_URI:https://digilocker.meripehchaan.gov.in/public/oauth2/1/file/}
digilocker.revoke=${DIGILOCKER_REVOKE:https://digilocker.gov.in/oauth/revoke}
spring.data.redis.host=localhost
spring.data.redis.port=6379


